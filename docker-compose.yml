services:
  nextjs-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nextjs_test_app
    ports:
      - "3000:3000"
    restart: always
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://admin:adminpassword@db:5432/app_db?schema=public
    depends_on:
      - db

  db:
    image: postgres:16-alpine
    container_name: postgres_db
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: adminpassword
      POSTGRES_DB: app_db
    ports:
      - "5432:5432" 
    volumes:
      - pg_data:/var/lib/postgresql/data

volumes:
  pg_data: